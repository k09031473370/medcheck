<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 奇数・偶数ページ分割</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.4rem; }
  .drop { border: 2px dashed #999; border-radius: 8px; padding: 32px; text-align: center; margin: 16px 0; }
  .drop.over { border-color: #06c; background: #eef5ff; }
  button { font-size: 1rem; padding: 10px 20px; cursor: pointer; }
  button:disabled { cursor: default; opacity: .5; }
  #log { white-space: pre-wrap; background: #f5f5f5; padding: 12px; border-radius: 6px; min-height: 3em; font-family: ui-monospace, monospace; font-size: .9rem; }
  ol li { margin: 4px 0; }
</style>
</head>
<body>
<h1>PDF を1ページずつ分割して奇数・偶数フォルダに振り分け</h1>
<p>複数の PDF をまとめて選ぶと、各ページを1ページだけの PDF にして
<code>odd/</code>(1,3,5…ページ)と <code>even/</code>(2,4,6…ページ)に分け、ZIP でダウンロードします。
処理はすべてこのブラウザ内で行われ、ファイルはどこにも送信されません。</p>

<div class="drop" id="drop">
  <p>ここに PDF をドラッグ&ドロップ、または</p>
  <input type="file" id="files" accept="application/pdf,.pdf" multiple>
</div>
<p><button id="run" disabled>分割して ZIP をダウンロード</button></p>
<div id="log">PDF を選択してください。</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function () {
  const input = document.getElementById('files');
  const drop = document.getElementById('drop');
  const runBtn = document.getElementById('run');
  const logEl = document.getElementById('log');
  let selected = [];

  function log(msg, reset) {
    if (reset) logEl.textContent = '';
    logEl.textContent += msg + '\n';
  }
  function setFiles(list) {
    selected = Array.from(list).filter(f => /\.pdf$/i.test(f.name) || f.type === 'application/pdf');
    runBtn.disabled = selected.length === 0;
    log(selected.length ? selected.map(f => `・${f.name} (${(f.size/1024/1024).toFixed(1)} MB)`).join('\n') : 'PDF を選択してください。', true);
  }
  input.addEventListener('change', () => setFiles(input.files));
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); setFiles(e.dataTransfer.files); });

  function pad(n) { return String(n).padStart(3, '0'); }

  async function splitOne(file, zip) {
    const { PDFDocument } = PDFLib;
    const src = await PDFDocument.load(await file.arrayBuffer(), { ignoreEncryption: true });
    const stem = file.name.replace(/\.pdf$/i, '');
    const total = src.getPageCount();
    let odd = 0, even = 0;
    for (let i = 0; i < total; i++) {
      const pageNo = i + 1;
      const doc = await PDFDocument.create();
      const [page] = await doc.copyPages(src, [i]);
      doc.addPage(page);
      const bytes = await doc.save();
      const folder = pageNo % 2 === 1 ? 'odd' : 'even';
      zip.file(`${folder}/${stem}_p${pad(pageNo)}.pdf`, bytes);
      if (folder === 'odd') odd++; else even++;
    }
    log(`${file.name}: 全${total}ページ -> odd ${odd}件 / even ${even}件`);
  }

  runBtn.addEventListener('click', async () => {
    runBtn.disabled = true;
    log('処理中...', true);
    try {
      const zip = new JSZip();
      zip.folder('odd'); zip.folder('even');
      for (const f of selected) await splitOne(f, zip);
      log('ZIP を作成中...');
      const blob = await zip.generateAsync({ type: 'blob' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'split_odd_even.zip';
      document.body.appendChild(a); a.click(); a.remove();
      log('完了: split_odd_even.zip をダウンロードしました。');
    } catch (e) {
      log('エラー: ' + (e && e.message ? e.message : e));
    } finally {
      runBtn.disabled = selected.length === 0;
    }
  });
})();
</script>
</body>
</html>
